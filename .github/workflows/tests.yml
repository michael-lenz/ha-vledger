# The library's tests on their own, the integration's against the oldest
# Home Assistant the project claims and the newest there is (QUA-04) — the
# claim in hacs.json is a tested one — and the Lovelace card's model.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests custom_components

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.2.0", ""]   # the declared minimum, and the latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,ha]"
      - if: matrix.homeassistant != ''
        run: pip install "homeassistant==${{ matrix.homeassistant }}"
      - run: python -m pytest -q tests/ha

  # The card's model, with Node's own runner and no packages (ADR-0039,
  # point 9). Node is a development tool for this one command, nothing more.
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/frontend/model.test.mjs

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
